name: Aggiorna catalogo auricolari

# Rigenera data.json leggendo l'anteprima pubblica dei canali Telegram.
# Gira ogni 20 minuti, oppure a mano da Actions → "Run workflow".

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/scan.mjs"
      - "lib/tg.js"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test del motore di scansione
        run: node test/run.mjs

      - name: Scansiona i canali Telegram
        env:
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
          ARCHIVE_DAYS: ${{ vars.ARCHIVE_DAYS }}
        run: node scripts/scan.mjs

      - name: Commit di data.json
        run: |
          git config user.name "auricolari-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Nessuna nuova offerta."
            exit 0
          fi
          git add data.json
          git commit -m "chore(data): aggiorna catalogo $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
